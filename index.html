<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Mr Jhansi Official Studio</title>
  <style>
    :root {
      --primary-color: #ff3366;
      --bg-color: #0f0f13;
      --panel-bg: #1a1a24;
      --text-color: #ffffff;
      --font-family: 'Arial', sans-serif;
    }

    html {
      background-color: var(--bg-color);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
    }

    #bg-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: -1;
      pointer-events: none;
    }

    #bgVideo {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
      display: none;
      pointer-events: none;
    }

    #bgImage {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      z-index: -3;
      background-color: #0f0f13;
      pointer-events: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: rgba(0, 0, 0, 0.85);
      border-bottom: 2px solid var(--primary-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--primary-color);
      object-fit: cover;
    }

    .admin-controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      transition: 0.3s;
    }

    .btn-upload { background-color: var(--primary-color); }
    .btn-settings { background-color: #9c27b0; }
    .btn-login { background-color: #2196f3; }

    .banner-container {
      width: 100%;
      height: 250px;
      overflow: hidden;
    }

    .banner-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .studio-title {
      text-align: center;
      padding: 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    }

    .studio-title h1 {
      margin: 0;
      color: var(--primary-color);
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
    }

    .studio-title p {
      margin: 5px 0 0;
      color: #ccc;
      font-size: 0.9rem;
    }

    .main-layout {
      display: flex;
      flex-wrap: wrap;
      padding: 20px;
      gap: 20px;
    }

    .sidebar {
      flex: 1;
      min-width: 260px;
      background-color: rgba(26, 26, 36, 0.9);
      padding: 20px;
      border-radius: 10px;
      height: fit-content;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .playlist-section-title {
      font-size: 0.85rem;
      color: var(--primary-color);
      text-transform: uppercase;
      margin: 15px 0 8px 5px;
      letter-spacing: 1px;
      border-bottom: 1px solid #333;
      padding-bottom: 3px;
    }

    .playlist-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .playlist-menu li {
      padding: 10px 12px;
      margin-bottom: 6px;
      background-color: rgba(255,255,255,0.05);
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
      border-left: 3px solid transparent;
      font-size: 0.95rem;
    }

    .playlist-menu li:hover, .playlist-menu li.active {
      background-color: rgba(255, 255, 255, 0.2);
      border-left: 3px solid var(--primary-color);
      color: var(--primary-color);
    }

    .content-area {
      flex: 3;
      min-width: 300px;
      padding-bottom: 60px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .song-card {
      background-color: rgba(26, 26, 36, 0.95);
      padding: 15px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-left: 4px solid var(--primary-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
    }

    .song-card::after {
      content: 'DJ MR JHANSI';
      position: absolute;
      top: 5px;
      right: 10px;
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.3);
      font-weight: bold;
      letter-spacing: 1px;
      pointer-events: none;
    }

    .song-info h3 { margin: 0 0 5px 0; color: var(--primary-color); font-size: 1.1rem; }
    .song-info p { margin: 0; color: #bbb; font-size: 0.8rem; }

    .action-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .download-btn {
      background-color: #4CAF50;
      padding: 8px 12px;
      text-decoration: none;
      color: white;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.85rem;
      display: inline-block;
    }

    .share-btn {
      background-color: #25D366;
      padding: 8px 12px;
      text-decoration: none;
      color: white;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.85rem;
      display: inline-block;
    }

    .youtube-btn {
      background-color: #FF0000;
      padding: 8px 12px;
      text-decoration: none;
      color: white;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.85rem;
      display: inline-block;
    }

    .delete-btn {
      background-color: #ff9800;
      padding: 8px 10px;
      border: none;
      color: white;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: #1a1a24;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--primary-color);
      box-sizing: border-box;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .modal-header h2 {
      margin: 0;
      color: var(--primary-color);
      font-size: 1.3rem;
      border: none;
      padding: 0;
    }

    .modal-close-top {
      background: #e91e63;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

      margin-bottom: 10px;
      background: #2a2a35;
      padding: 8px;
      border-radius: 5px;
